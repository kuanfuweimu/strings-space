<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0b0b}svg{display:block}text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><radialGradient id="spot" cx="50%" cy="48%" r="55%"><stop offset="0" stop-color="#3a3d44"/><stop offset=".6" stop-color="#1a1b1e"/><stop offset="1" stop-color="#0b0b0b"/></radialGradient></defs><rect width="1600" height="980" fill="#0b0b0b"/><ellipse cx="802" cy="520" rx="640" ry="420" fill="url(#spot)"/><image id="ds" x="290" y="150" width="1024" height="741"/><text x="40" y="62" font-size="26" fill="#fff" font-weight="800">PS5 DUALSENSE</text><text x="40" y="86" font-size="13" fill="#999">STRINGS 投影控制映射 · 手柄只管镜头和切换</text><polyline points="270,150 310,150 545,180" fill="none" stroke="#4fd1ff" stroke-width="2"/><circle cx="545" cy="180" r="7" fill="none" stroke="#4fd1ff" stroke-width="2.5"/><circle cx="545" cy="180" r="2.5" fill="#4fd1ff"/><text x="260" y="146" text-anchor="end" font-size="16" font-weight="700" fill="#4fd1ff">L2 拉远 · L1 上一段</text><text x="260" y="166" text-anchor="end" font-size="12.5" fill="#bbb">L2 压得越深拉得越快 (肩键在顶部)</text><polyline points="270,285 310,285 520,275" fill="none" stroke="#7be08a" stroke-width="2"/><circle cx="520" cy="275" r="7" fill="none" stroke="#7be08a" stroke-width="2.5"/><circle cx="520" cy="275" r="2.5" fill="#7be08a"/><text x="260" y="281" text-anchor="end" font-size="16" font-weight="700" fill="#7be08a">十字键 ↑ 自动旋转加快</text><text x="260" y="301" text-anchor="end" font-size="12.5" fill="#bbb">每按一次 +0.5</text><polyline points="270,370 310,370 466,330" fill="none" stroke="#ff6fd8" stroke-width="2"/><circle cx="466" cy="330" r="7" fill="none" stroke="#ff6fd8" stroke-width="2.5"/><circle cx="466" cy="330" r="2.5" fill="#ff6fd8"/><text x="260" y="366" text-anchor="end" font-size="16" font-weight="700" fill="#ff6fd8">十字键 ← 上一段 · → 下一段</text><text x="260" y="386" text-anchor="end" font-size="12.5" fill="#bbb">与 L1 / R1 相同</text><polyline points="270,455 310,455 527,364" fill="none" stroke="#7be08a" stroke-width="2"/><circle cx="527" cy="364" r="7" fill="none" stroke="#7be08a" stroke-width="2.5"/><circle cx="527" cy="364" r="2.5" fill="#7be08a"/><text x="260" y="451" text-anchor="end" font-size="16" font-weight="700" fill="#7be08a">十字键 ↓ 自动旋转减慢</text><text x="260" y="471" text-anchor="end" font-size="12.5" fill="#bbb">每按一次 −0.5，减到 0 停转</text><polyline points="270,600 310,600 660,445" fill="none" stroke="#4fd1ff" stroke-width="2"/><circle cx="660" cy="445" r="7" fill="none" stroke="#4fd1ff" stroke-width="2.5"/><circle cx="660" cy="445" r="2.5" fill="#4fd1ff"/><text x="260" y="596" text-anchor="end" font-size="16" font-weight="700" fill="#4fd1ff">左摇杆 · 环绕 / 升降</text><text x="260" y="616" text-anchor="end" font-size="12.5" fill="#bbb">左右 = 绕中心转 · 上下 = 相机升降</text><polyline points="1330,150 1290,150 1060,180" fill="none" stroke="#4fd1ff" stroke-width="2"/><circle cx="1060" cy="180" r="7" fill="none" stroke="#4fd1ff" stroke-width="2.5"/><circle cx="1060" cy="180" r="2.5" fill="#4fd1ff"/><text x="1340" y="146" text-anchor="start" font-size="16" font-weight="700" fill="#4fd1ff">R2 推近 · R1 下一段</text><text x="1340" y="166" text-anchor="start" font-size="12.5" fill="#bbb">R2 压得越深推得越快</text><polyline points="1330,235 1290,235 1032,236" fill="none" stroke="#4a4a4a" stroke-width="2"/><circle cx="1032" cy="236" r="7" fill="none" stroke="#4a4a4a" stroke-width="2.5"/><circle cx="1032" cy="236" r="2.5" fill="#4a4a4a"/><text x="1340" y="231" text-anchor="start" font-size="16" font-weight="700" fill="#4a4a4a">Options · 显示 / 隐藏 HUD</text><text x="1340" y="251" text-anchor="start" font-size="12.5" fill="#bbb">左下角状态文字，演出时保持隐藏</text><polyline points="1330,320 1290,320 1108,266" fill="none" stroke="#4fd1ff" stroke-width="2"/><circle cx="1108" cy="266" r="7" fill="none" stroke="#4fd1ff" stroke-width="2.5"/><circle cx="1108" cy="266" r="2.5" fill="#4fd1ff"/><text x="1340" y="316" text-anchor="start" font-size="16" font-weight="700" fill="#4fd1ff">△ 镜头复位</text><text x="1340" y="336" text-anchor="start" font-size="12.5" fill="#bbb">距离 / 高度 / 角度 / 视角回默认</text><polyline points="1330,400 1290,400 1179,332" fill="none" stroke="#ffb347" stroke-width="2"/><circle cx="1179" cy="332" r="7" fill="none" stroke="#ffb347" stroke-width="2.5"/><circle cx="1179" cy="332" r="2.5" fill="#ffb347"/><text x="1340" y="396" text-anchor="start" font-size="16" font-weight="700" fill="#ffb347">○ 黑场</text><text x="1340" y="416" text-anchor="start" font-size="12.5" fill="#bbb">淡出到黑，再按淡回</text><polyline points="1330,480 1290,480 1116,396" fill="none" stroke="#7be08a" stroke-width="2"/><circle cx="1116" cy="396" r="7" fill="none" stroke="#7be08a" stroke-width="2.5"/><circle cx="1116" cy="396" r="2.5" fill="#7be08a"/><text x="1340" y="476" text-anchor="start" font-size="16" font-weight="700" fill="#7be08a">× 自动轮播</text><text x="1340" y="496" text-anchor="start" font-size="12.5" fill="#bbb">开 / 关</text><polyline points="1330,560 1290,560 1042,331" fill="none" stroke="#4a4a4a" stroke-width="2"/><circle cx="1042" cy="331" r="7" fill="none" stroke="#4a4a4a" stroke-width="2.5"/><circle cx="1042" cy="331" r="2.5" fill="#4a4a4a"/><text x="1340" y="556" text-anchor="start" font-size="16" font-weight="700" fill="#4a4a4a">□ 未分配</text><text x="1340" y="576" text-anchor="start" font-size="12.5" fill="#bbb"></text><polyline points="1330,650 1290,650 975,445" fill="none" stroke="#4fd1ff" stroke-width="2"/><circle cx="975" cy="445" r="7" fill="none" stroke="#4fd1ff" stroke-width="2.5"/><circle cx="975" cy="445" r="2.5" fill="#4fd1ff"/><text x="1340" y="646" text-anchor="start" font-size="16" font-weight="700" fill="#4fd1ff">右摇杆 · 视角 / 视点</text><text x="1340" y="666" text-anchor="start" font-size="12.5" fill="#bbb">左右 = 视角 FOV 宽窄 · 上下 = 看向的高度</text><text x="40" y="920" font-size="13" fill="#999">使用：USB 或蓝牙连接电脑 → 在输出窗口按一下手柄任意键激活 → 控制面板「外设」显示已检测到。摇杆有小死区，轻推不会抖。</text><text x="40" y="944" font-size="11" fill="#555">Controller photo: Wikimedia Commons, “Playstation 5 DualSense controller in Midnight Black” · Launch Control XL 3 image: Novation user guide</text></svg><script>
const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d'); g.drawImage(im,0,0);
  const D=g.getImageData(0,0,c.width,c.height), p=D.data, W=c.width, H=c.height, seen=new Uint8Array(W*H), st=[];
  const bg=i=>p[i*4]>226&&p[i*4+1]>226&&p[i*4+2]>226;
  for(let x=0;x<W;x++){ st.push(x, (H-1)*W+x); } for(let y=0;y<H;y++){ st.push(y*W, y*W+W-1); }
  while(st.length){ const i=st.pop(); if(seen[i]||!bg(i)) continue; seen[i]=1; p[i*4+3]=0; const x=i%W;
    if(x>0)st.push(i-1); if(x<W-1)st.push(i+1); if(i>=W)st.push(i-W); if(i<W*(H-1))st.push(i+W); }
  for(let i=0;i<W*H;i++) if(!seen[i]){ const x=i%W; let n=0; if(x>0&&seen[i-1])n++; if(x<W-1&&seen[i+1])n++; if(i>=W&&seen[i-W])n++; if(i<W*(H-1)&&seen[i+W])n++; if(n) p[i*4+3]=Math.min(p[i*4+3],140); }
  g.putImageData(D,0,0); document.getElementById('ds').setAttribute('href',c.toDataURL()); document.title='ready'; };
im.src='ds_black.jpg';
</script></body></html>
