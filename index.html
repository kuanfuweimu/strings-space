<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>STRINGS SPACE · output</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
  #hud{position:fixed;left:18px;bottom:14px;font:12px/1.6 ui-monospace,Consolas,monospace;color:#8a8a8a;
       letter-spacing:.06em;user-select:none;transition:opacity .2s}
  #hud b{color:#ddd;font-weight:500}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#f66;font:14px monospace;white-space:pre-wrap;padding:40px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="err"></div>
<script src="materials.js"></script>
<script src="growth-tracker.js"></script>
<script src="parameter-lag.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const ROWS = 10000, COLS = 4, MAXN = ROWS*COLS, BASE = 4000;   // density 1 = BASE strings, up to MAXN
const N = MAXN;
const SEG = +(q.get('seg') || 128);       // points per string
const RENDER = q.get('render') === '1';   // offline export mode (needs server.js)

const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
function fail(m){ const e=document.getElementById('err'); e.style.display='flex'; e.textContent=m; throw new Error(m); }
if(!gl) fail('WebGL2 not available');
if(!gl.getExtension('EXT_color_buffer_float')) fail('EXT_color_buffer_float not available');

// ---------- scenes ----------
const KEYS=['na','nf','ns','swirl','rad','radAx','up','pull','lifeMin','lifeRange','spawn','pulseAmt','advect','len','glow','width',
            'hist','speed','pulseHz','expo','fish','camD','camH','orbit','lookY','chase','gFloor','gArch','gLattice','gBeams'];
const DEF={na:.3,nf:.7,ns:.05,swirl:0,rad:0,radAx:0,up:0,pull:.6,lifeMin:4,lifeRange:5,spawn:1,pulseAmt:0,advect:.25,len:1,glow:.2,width:1.1,
           hist:24,speed:1,pulseHz:.25,expo:1,fish:0,camD:3.0,camH:.25,orbit:.035,lookY:-.05,chase:0,gFloor:1,gArch:0,gLattice:0,gBeams:0};
const NP=KEYS.length;
const S=(name,mode,o)=>({name,mode,P:KEYS.map(k=>(k in o?o[k]:DEF[k]))});
const SCENES=[
  S('VORTEX 漩涡',0,{gBeams:.8,gArch:.6,camH:.1,na:.3,swirl:.55,radAx:.24,spawn:1.2,hist:20,glow:.15}),
  S('GROWTH 生长',1,{gLattice:1,camD:3.7,na:.42,nf:.8,ns:.03,swirl:.08,up:.3,pull:.5,lifeMin:7,lifeRange:6,spawn:.5,pulseAmt:.7,advect:.04,glow:.9,width:1.2,hist:10,pulseHz:.18,expo:1.1}),
  S('PULSE 脉冲',2,{gArch:.75,na:.28,nf:1,ns:.06,swirl:.22,rad:.42,pull:.8,lifeMin:3,lifeRange:3,spawn:3,pulseAmt:1,advect:.35,len:.85,glow:1,pulseHz:.3,expo:1.2}),
  S('DRIFT 漂流',3,{gLattice:.7,gFloor:.7,na:.5,nf:.6,ns:.04,swirl:.12,pull:.8,lifeMin:5,lifeRange:6,advect:.6,len:.4,glow:.25,width:1.3,expo:2.2}),
  S('VEIL 帷幕',4,{gBeams:1,camD:3.7,na:.22,nf:.9,ns:.04,swirl:.05,up:-.38,pull:.2,lifeMin:8,lifeRange:4,spawn:.8,pulseAmt:.5,pulseHz:.15,advect:.12,glow:.6,hist:12,expo:1.2}),
  S('RIBBON 丝带',5,{gArch:.8,na:.25,nf:.8,chase:1.3,pull:.3,lifeMin:9,lifeRange:6,advect:.1,glow:.35,camD:3.2,expo:1.2}),
  S('DOME 穹顶 · fisheye',6,{gArch:.55,fish:1,na:.2,swirl:.7,radAx:-.16,pull:.3,lifeMin:6,lifeRange:5,spawn:1.2,advect:.3,hist:16,camD:.35,camH:-1.5,lookY:1,orbit:.05,expo:1.3}),
  S('CANOPY 林冠 · fisheye',7,{gLattice:1,fish:1,na:.4,nf:.8,ns:.03,swirl:.1,radAx:-.05,up:.34,pull:.5,lifeMin:8,lifeRange:6,spawn:.5,pulseAmt:.6,advect:.04,glow:.9,width:1.2,hist:10,pulseHz:.18,camD:.3,camH:-1.35,lookY:1,orbit:.03,expo:1.2}),
  S('NEBULA 星云 · fisheye',3,{gBeams:.8,gArch:.5,gFloor:.6,fish:1,na:.55,nf:.5,swirl:.2,pull:.8,lifeMin:6,lifeRange:6,advect:.5,glow:.4,camD:.5,camH:0,lookY:.2,orbit:.06,expo:1.0}),
];
// live globals, driven by control.html over BroadcastChannel
const G={dim:1,expo:1,white:.88,bloom:1,width:1,speed:1,turb:1,density:+(q.get('density')||3),fish:-1,orbit:1,pulse:1,trans:3.5,dur:45,light:1,lrange:1,lspeed:1,ambient:1,metal:1,reflect:1,gfloor:1,arch:1,lattice:1,beams:1,camD:1,camH:0,yaw:0,lookY:0,fov:50,auto:q.get('auto')!=='0',hud:q.get('hud')==='1'};
Object.assign(G,StringsMaterials.defaults,{follow:q.get('follow')==='1',followStrength:.8,followSmooth:1.8,trans:.2});
const requestedMaterial=StringsMaterials.presets[q.get('material')];
if(requestedMaterial) Object.assign(G,requestedMaterial.values);
Object.assign(G,StringsMaterials.sanitize(Object.fromEntries([...q].filter(([k])=>k in StringsMaterials.ranges).map(([k,v])=>[k,Number(v)]))));
const controls=new ParameterLag(G,.2);

// ---------- shaders ----------
const FLOOR = -1.55;
const PROJ = `
uniform mat4 uV; uniform float uF,uAspect,uFish;
// returns ndc.xy, distance; ok=0 when the point cannot be shown
vec3 proj(vec3 p,out float ok){
  vec3 v=(uV*vec4(p,1.)).xyz; float d=length(v), z=-v.z;
  vec2 pp=v.xy*uF/max(z,.05);
  float th=acos(clamp(z/max(d,1e-5),-1.,1.)), rl=length(v.xy);
  vec2 fp=rl>1e-5?v.xy/rl*th/1.2217:vec2(0.);
  ok=(uFish<.999?step(.15,z):1.)*step(th,2.7)*step(.05,d);
  vec2 n=mix(pp,fp,uFish); n.x/=uAspect;
  return vec3(n,d);
}`;
// Strings and the static structure share this program: uStruct selects the texture layout.
const VS_FULL = `#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.-1.,0,1); }`;

const FS_SIM = `#version 300 es
precision highp float;
uniform sampler2D uS;
uniform float uT,uDt,uShift,uSeed,uMode,uActive;
uniform float uP[${NP}];
out vec4 o;
const int SEGC=${SEG}, ROWS=${ROWS};
const float FLOOR=${FLOOR}+.015;
float h1(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec3 h3(vec2 p){ return vec3(h1(p),h1(p+17.1),h1(p+41.7)); }
const mat3 R=mat3(0.,.8,.6,-.8,.36,-.48,-.6,-.48,.64);
const vec3 AX=vec3(.3304,.9441,.1888);
vec3 pot(vec3 p){
  vec3 s=vec3(0.); float a=1.; p*=uP[1];
  for(int i=0;i<3;i++){ p=R*p*1.7+vec3(0.,uT*uP[2],3.1); s+=a*sin(p.yzx+1.3*cos(p.zxy)); a*=.55; }
  return s;
}
vec3 curl(vec3 p){
  const float e=.02;
  vec3 dx=pot(p+vec3(e,0,0))-pot(p-vec3(e,0,0));
  vec3 dy=pot(p+vec3(0,e,0))-pot(p-vec3(0,e,0));
  vec3 dz=pot(p+vec3(0,0,e))-pot(p-vec3(0,0,e));
  return vec3(dy.z-dz.y, dz.x-dx.z, dx.y-dy.x)/(2.*e*uP[1]*4.);
}
vec3 emitter(){ return vec3(1.5*sin(.37*uT),.8*sin(.53*uT+1.),.9*sin(.29*uT+2.)); }
vec3 vel(vec3 p,float id){
  vec3 v=curl(p)*uP[0];
  float h=dot(p,AX); vec3 rp=p-AX*h; float r=length(rp);
  v+=uP[3]*cross(AX,rp)/(.25+1.2*r*r);
  v+=uP[5]*rp/(r+.15);
  v+=uP[4]*p/(length(p)+.1);
  v.y+=uP[6]*(uP[6]>0.?smoothstep(1.7,-.6,p.y):smoothstep(-1.7,.6,p.y));
  v-=uP[7]*p*smoothstep(1.2,2.4,length(p));
  v+=uP[25]*(emitter()+(h3(vec2(id,23.))-.5)*vec3(.9,.5,.5)-p);
  return v;
}
vec3 spawn(vec3 r){
  if(uMode<.5){
    vec3 u=normalize(cross(AX,vec3(1,0,0))), w=cross(AX,u);
    float a=r.x*6.2832, rr=.04+.22*sqrt(r.y);
    return AX*(r.z-.5)*1.5+(u*cos(a)+w*sin(a))*rr;
  }else if(uMode<1.5){
    float k=floor(r.x*9.)+floor(uT/30.)*13.;
    vec2 c=(vec2(h1(vec2(k,3.)),h1(vec2(k,9.)))-.5);
    return vec3(c.x*3.4,-1.45,c.y*1.5)+vec3(r.y-.5,0.,r.z-.5)*.16;
  }else if(uMode<2.5){
    float z=r.x*2.-1., a=r.y*6.2832, s=sqrt(1.-z*z);
    return vec3(s*cos(a),z,s*sin(a))*(.12+.1*r.z);
  }else if(uMode<3.5){
    return (r-.5)*vec3(4.4,2.8,3.2);
  }else if(uMode<4.5){
    float x=(r.x-.5)*4.8;
    return vec3(x,1.75+.05*r.z,.55*sin(x*1.3+uT*.12)+(r.y-.5)*.06);
  }else if(uMode<5.5){
    return emitter()+(r-.5)*.6;
  }else if(uMode<6.5){
    vec3 u=normalize(cross(AX,vec3(1,0,0))), w=cross(AX,u);
    float a=r.x*6.2832, rr=1.7+.5*r.y;
    return AX*(r.z-.5)*.7+(u*cos(a)+w*sin(a))*rr;
  }
  float k=floor(r.x*9.), a=(k+.5*h1(vec2(k,3.)+floor(uT/30.)))/9.*6.2832, rr=1.0+.6*h1(vec2(k,9.));
  return vec3(cos(a)*rr,-1.45,sin(a)*rr)+vec3(r.y-.5,0.,r.z-.5)*.16;
}
void main(){
  ivec2 c=ivec2(gl_FragCoord.xy); int kx=c.x%SEGC; float id=float((c.x/SEGC)*ROWS+c.y);
  if(id>=uActive){ o=vec4(0.,0.,0.,-1.); return; }
  float sp=uP[17]*(.6+.8*h1(vec2(id,7.)));
  if(kx==0){
    vec4 s=texelFetch(uS,c,0);
    if(s.w<0.){
      float env=mix(1., pow(.5+.5*cos(6.2832*uT*uP[18]),8.)*6., uP[11]);
      if(h1(vec2(id,uSeed))<uP[10]*uDt*env) s=vec4(spawn(h3(vec2(id,uSeed+3.7))),0.);
    }else{
      s.xyz+=vel(s.xyz,id)*sp*uDt; s.y=max(s.y,FLOOR); s.w+=uDt;
      if(s.w>uP[8]+uP[9]*h1(vec2(id,11.))) s.w=-1.;
    }
    o=s;
  }else{
    vec4 s=uShift>.5?texelFetch(uS,c-ivec2(1,0),0):texelFetch(uS,c,0);
    if(s.w>=0.){ s.xyz+=(vel(s.xyz,id)-uP[25]*(emitter()-s.xyz))*sp*uDt*uP[12]; s.y=max(s.y,FLOOR); }
    o=s;
  }
}`;

const VS_LINE = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uS; uniform vec2 uRes; uniform float uT,uPx,uStruct,uMirror,uFloorY;
uniform vec4 uLayer; uniform ivec4 uLayerEnd;
uniform float uP[${NP}];
out vec3 vPos; out vec3 vT; out float vSide; out float vEm; out float vAlb; out float vFade;
const int ROWS=${ROWS};
float h1(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
${PROJ}
void main(){
  const int S=${SEG};
  int k=gl_InstanceID%(S-1), i=gl_InstanceID/(S-1);
  bool st=uStruct>.5;
  ivec2 t=st?ivec2(k,i):ivec2((i/ROWS)*S+k,i%ROWS);
  vec4 a=texelFetch(uS,t,0), b=texelFetch(uS,t+ivec2(1,0),0);
  float side=(gl_VertexID&1)==0?-1.:1., end=gl_VertexID<2?0.:1.;
  vec3 pa=a.xyz, pb=b.xyz;
  if(uMirror>0.){ pa.y=2.*uFloorY-pa.y; pb.y=2.*uFloorY-pb.y; }
  float oka,okb; vec3 na=proj(pa,oka), nb=proj(pb,okb);
  bool ok=a.w>=0.&&b.w>=0.&&a.w>=b.w&&oka*okb>.5;
  float id=float(i), u=(float(k)+end)/float(S), amt=1.; int layer=-1;
  if(st){ layer=i<uLayerEnd.x?0:i<uLayerEnd.y?1:i<uLayerEnd.z?2:3; amt=uLayer[layer]; ok=ok&&amt>.002&&!(uMirror>0.&&layer==0); }
  if(!ok){ gl_Position=vec4(2.,2.,2.,1.); vPos=vec3(0.); vT=vec3(1.,0.,0.); vSide=0.; vEm=0.; vAlb=0.; vFade=0.; return; }
  vec2 d=(nb.xy-na.xy)*uRes; float L=length(d);
  vec2 n=L>1e-4?vec2(-d.y,d.x)/L:vec2(0.,1.);
  vec3 cp=mix(na,nb,end);
  float fade,em,alb,wm=1.;
  if(st){
    float h=h1(vec2(id,71.));
    fade=smoothstep(0.,.06,amt*1.4-u-.3*h);                       // lines grow in from their start as the layer comes up
    em=uP[14]*.8*pow(.5+.5*sin(u*7.-uT*1.3+h*6.2832),30.);
    alb=(layer==0?1.1:mix(.25,1.1,h))*min(amt,1.5); wm=layer==0?.7:mix(.7,1.3,h1(vec2(id,13.)));
    if(layer==0) fade*=exp(-mix(.07,.45,uFish)*cp.z);
  }else{
    float age=mix(a.w,b.w,end);
    fade=smoothstep(uP[13],uP[13]*.55,u)*smoothstep(0.,.25,age+u);
    em=uP[14]*1.1*pow(.5+.5*sin(age*2.2-uT*1.8+h1(vec2(id,5.))*1.5),14.);
    alb=mix(.05,1.,pow(h1(vec2(id,2.)),1.5));
  }
  float wpx=uP[15]*uPx*wm*clamp(3.6/cp.z,.5,2.5)*mix(.35,1.,fade);
  gl_Position=vec4(cp.xy+n*side*wpx/uRes,clamp(cp.z/60.,0.,1.)*2.-1.,1.);
  vec3 wp=mix(a.xyz,b.xyz,end);
  float fog=exp(-.2*max(cp.z-2.6,0.));
  float mir=uMirror>0.?uMirror*exp(-max(wp.y-uFloorY,0.)*.7):1.;
  vec3 tangent=b.xyz-a.xyz;
  vec4 prev=texelFetch(uS,t-ivec2(k>0?1:0,0),0);
  vec4 next=texelFetch(uS,t+ivec2(k<S-2?2:1,0),0);
  vec3 ta=k>0&&prev.w>=a.w?b.xyz-prev.xyz:tangent;
  vec3 tb=k<S-2&&next.w>=0.&&b.w>=next.w?next.xyz-a.xyz:tangent;
  vPos=wp; vT=mix(ta/max(length(ta),.000001),tb/max(length(tb),.000001),end); vSide=side; vEm=em; vAlb=alb; vFade=fade*fog*mir;
}`;
// Metal wire: each ribbon is shaded as a cylinder (normal swept across its width) under three point lights,
// plus a strand highlight along the tangent and a simple studio environment for the metallic gleam.
const FS_LINE = `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vT; in float vSide; in float vEm; in float vAlb; in float vFade;
uniform vec3 uCam; uniform vec4 uL[3]; uniform float uAmb,uMetal,uRange;
uniform float uRoughness,uAnisotropy,uSpecular,uEnv,uEnvAngle,uEnvWidth,uWarmth,uEmission,uLegacy;
out vec4 o;
float legacy(vec3 T,vec3 V,vec3 N){
  float sh=mix(10.,80.,clamp(uMetal*.5,0.,1.)), c=0.;
  for(int l=0;l<4;l++){
    vec3 Ld; float att;
    if(l<3){ vec3 Lv=uL[l].xyz-vPos; float d2=dot(Lv,Lv); Ld=Lv*inversesqrt(d2+1e-6); att=uL[l].w/(1.+d2*uRange); }
    else{ Ld=normalize(vec3(.35,.8,.45)); att=.45*uAmb; }      // fixed overhead key so the room stays readable away from the moving lights
    vec3 Hh=normalize(Ld+V); float nl=max(dot(N,Ld),0.);
    float th=dot(T,Hh), kk=pow(max(1.-th*th,0.),sh*.5), sp=pow(max(dot(N,Hh),0.),sh);
    c+=att*(.18*nl+uMetal*(.6*kk*(.2+.8*nl)+1.4*sp));
  }
  vec3 R=reflect(-V,N);
  float env=smoothstep(.35,.95,R.y)*.5+pow(1.-abs(R.y),8.)*.25;
  float rim=pow(1.-max(dot(N,V),0.),3.);
  c+=uAmb*(.04+uMetal*.1*env+.06*rim);
  c=c*vAlb+vEm;
  return c;
}
float softbox(vec3 r,vec3 forward,vec3 up,vec2 size,float blur){
  vec3 side=normalize(cross(forward,up)); up=cross(side,forward);
  float facing=dot(r,forward);
  vec2 p=vec2(dot(r,side),dot(r,up))/max(facing,.03);
  vec2 aa=max(fwidth(p)*.6,vec2(.002));
  vec2 mask=1.-smoothstep(size-aa,size+vec2(blur)+aa,abs(p));
  return mask.x*mask.y*smoothstep(0.,.15,facing);
}
vec3 studio(vec3 r,float rough){
  float a=radians(uEnvAngle), c=cos(a), s=sin(a);
  r=vec3(c*r.x-s*r.z,r.y,s*r.x+c*r.z);
  float blur=rough*rough*.7;
  float key=softbox(r,normalize(vec3(.7,.35,.7)),vec3(0,1,0),vec2(uEnvWidth,.95),blur);
  float fill=softbox(r,normalize(vec3(-.65,.25,.7)),vec3(0,1,0),vec2(uEnvWidth*.65,.7),blur);
  float top=softbox(r,normalize(vec3(0,1,-.25)),vec3(0,0,1),vec2(.85,uEnvWidth),blur);
  return vec3(.014+.035*smoothstep(-.2,.8,r.y))+key*vec3(2.4,2.48,2.6)+fill*vec3(1.45,1.38,1.28)+top*1.6;
}
vec3 fresnel(float cosTheta,vec3 f0){ return f0+(1.-f0)*pow(1.-clamp(cosTheta,0.,1.),5.); }
void main(){
  if(vFade<.004 || dot(vT,vT)<1e-12) discard;
  vec3 T=normalize(vT), V=normalize(uCam-vPos);
  vec3 B=cross(T,V);
  if(dot(B,B)<1e-8) B=cross(T,abs(T.y)<.9?vec3(0,1,0):vec3(1,0,0));
  B=normalize(B);
  vec3 Nf=normalize(cross(B,T));
  float side=clamp(vSide,-.999,.999);
  vec3 N=normalize(B*side+Nf*sqrt(1.-side*side));
  if(uLegacy>.999){ o=vec4(vec3(legacy(T,V,N)*vFade),1.); return; }
  B=normalize(cross(N,T));
  float metal=clamp(uMetal,0.,1.), rough=clamp(uRoughness,.08,1.);
  // Specular anti-aliasing for thin subpixel wires. No extra geometry/pass.
  float variance=min(.06,.12*(dot(dFdx(N),dFdx(N))+dot(dFdy(N),dFdy(N))));
  float alpha=max(.012,rough*rough+variance);
  float at=max(.012,alpha*(1.+uAnisotropy)), ab=max(.012,alpha*(1.-uAnisotropy));
  vec3 tint=mix(vec3(.65,.76,.9),vec3(.94,.76,.53),uWarmth*.5+.5);
  vec3 base=tint*mix(.48,.95,clamp(vAlb,0.,1.));
  vec3 f0=mix(vec3(.04),base,metal), color=vec3(0.);
  float nv=max(dot(N,V),.001), tv=dot(T,V), bv=dot(B,V);
  for(int l=0;l<4;l++){
    vec3 L; float att;
    if(l<3){ vec3 v=uL[l].xyz-vPos; float d2=dot(v,v); L=v*inversesqrt(d2+1e-6); att=uL[l].w/(1.+d2*uRange); }
    else{ L=normalize(vec3(.35,.8,.45)); att=.45*uAmb; }
    vec3 H=normalize(L+V); float nl=max(dot(N,L),0.), nh=max(dot(N,H),0.);
    vec3 h=vec3(dot(T,H)/at,dot(B,H)/ab,nh);
    float d=1./max(3.14159265*at*ab*pow(dot(h,h),2.),.000001);
    float lv=nl*length(vec3(at*tv,ab*bv,nv));
    float ll=nv*length(vec3(at*dot(T,L),ab*dot(B,L),nl));
    float vis=.5/max(lv+ll,.0001);
    vec3 F=fresnel(dot(V,H),f0);
    color+=att*nl*((1.-metal)*(1.-F)*base/3.14159265+min(F*d*vis,vec3(12.))*uSpecular);
  }
  vec3 reflected=reflect(-V,N);
  color+=studio(reflected,rough)*fresnel(nv,f0)*uEnv*uSpecular*mix(1.,.55,rough);
  color+=base*(1.-metal)*uAmb*.045;
  color+=vec3(vEm*uEmission);
  if(uLegacy>.001) color=mix(color,vec3(legacy(T,V,N)),uLegacy);
  o=vec4(color*vFade,1.);
}`;
const VS_DOT = `#version 300 es
precision highp float;
uniform vec4 uL[3]; uniform float uPx,uMirror,uFloorY;
out float vI;
${PROJ}
void main(){
  vec4 l=uL[gl_VertexID]; vec3 p=l.xyz; if(uMirror>0.) p.y=2.*uFloorY-p.y;
  float ok; vec3 n=proj(p,ok);
  gl_Position=ok>.5?vec4(n.xy,clamp(n.z/60.,0.,1.)*2.-1.,1.):vec4(2.,2.,2.,1.);

canvas.addEventListener('wheel',e=>{ share('camD',Math.max(.15,Math.min(3,controls.target.camD*Math.exp(e.deltaY*.001)))); e.preventDefault(); },{passive:false});

let bc=null;
try{ bc=new BroadcastChannel('strings'); }catch(e){}
const sendState=()=>bc&&bc.postMessage({t:'state',cur,fps:Math.round(fps),G:controls.target,names:SCENES.map(s=>s.name),n:active(),seg:SEG,w:W,h:H,rec:!!rec,pad:padName,left:Math.max(0,G.dur-sceneT|0),tracking:!G.follow?'off':growthTracker?.failed?'error':focusRig.age<1.5?'following':'waiting'});
if(bc) bc.onmessage=ev=>{ const m=ev.data||{};
  if(m.t==='g') controls.set({[m.k]:m.v});
  else if(m.t==='material') controls.set(StringsMaterials.sanitize(m.values));
  else if(m.t==='camreset') controls.set({...CAM0,follow:false});
  else if(m.t==='black') controls.set({dim:controls.target.dim<.01?1:0});
  else if(m.t==='scene'){ go(m.i); if(m.hold) controls.set({auto:false}); }
  else if(m.t==='rec') toggleRec();
  else if(m.t==='hello') sendState();
};

// ---------- gamepad: the control panel owns the mapping; outputs only relay raw state in case the panel can't see the pad ----------
const CAM0={camD:1,camH:0,yaw:0,lookY:0,fov:50};
let padName='';
function pollPad(){
  const gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(g=>g&&g.connected&&g.mapping==='standard');
  padName=gp?gp.id:'';
  if(gp&&bc&&frame%2===0) bc.postMessage({t:'padraw',id:gp.id,a:[...gp.axes],b:gp.buttons.map(x=>x.value)});
}

let last=performance.now(),lastStateSent=0,lastHud=0;
function tick(now){
  requestAnimationFrame(tick);
  resize();
  const elapsed=(now-last)/1000, dt=Math.min(elapsed,1/20); last=now; if(elapsed<=0) return;
  fps+=(1/elapsed-fps)*.05; sceneT+=dt;
  controls.step(dt); updateParameters(dt);
  if(G.auto&&sceneT>G.dur) go(cur+1);
  pollPad();
  dimNow=G.dim;
  if(G.speed>0) stepSim(dt*G.speed);
  draw(dt);
  hud.style.opacity=G.hud?1:0;
  if(now-lastStateSent>100){ sendState(); lastStateSent=now; }
  if(now-lastHud>250){
    lastHud=now;
    hud.innerHTML='<b>'+(cur+1)+' · '+SCENES[cur].name+'</b> '+(G.auto?'· auto '+Math.max(0,G.dur-sceneT|0)+'s':'· hold')+(rec?' · <b style="color:#f55">REC</b>':'')+
      '<br>'+active()+' strings × '+SEG+' · '+W+'×'+H+' · '+fps.toFixed(0)+' fps<br>1–9 scene · ←/→ · space auto · F fullscreen · C control · R record · H info · T track';
  }
}

// ---------- offline export: fixed timestep, every frame sent to server.js → ffmpeg ----------
async function renderAll(){
  const fpsOut=+(q.get('fps')||60), secs=+(q.get('secs')||10), warm=+(q.get('warm')||22);
  const list=(q.get('scenes')||'all')==='all'?SCENES.map((_,i)=>i):q.get('scenes').split(',').map(s=>+s-1);
  setSize(+(q.get('w')||3840),+(q.get('h')||2160));
  G.auto=false; G.trans=0; controls.set({auto:false,trans:0});
  for(const i of list){
    const name=String(i+1).padStart(2,'0')+'_'+SCENES[i].name.split(' ')[0].toLowerCase();
    resetSim(); cur=i; T=i*37; frame=0; acc=0; camA=.6+i;
    updateParameters(1);
    for(let k=0;k<warm*30;k++){ stepSim(1/30); if(k%60===0){ gl.flush(); await new Promise(r=>setTimeout(r,0)); } }
    let r=await fetch(`/start?name=${name}&fps=${fpsOut}`,{method:'POST'}); if(!r.ok) fail('server /start failed');
    const total=secs*fpsOut;
    for(let f=0;f<total;f++){
      stepSim(1/fpsOut); draw(1/fpsOut,true);
      const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',.97));
      r=await fetch('/frame',{method:'POST',body:blob}); if(!r.ok) fail('server /frame failed');
      if(f%10===0) hud.innerHTML='<b>EXPORT '+name+'</b> '+f+' / '+total;
    }
    await fetch('/end',{method:'POST'});
  }
  hud.innerHTML='<b>EXPORT DONE</b>'; window.__done=true;
  await fetch('/done',{method:'POST'});
}
if(RENDER) renderAll().catch(e=>fail(String(e))); else requestAnimationFrame(tick);
</script>
